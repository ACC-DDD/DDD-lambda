name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Install dependencies
        run: npm ci

      - name: Find changed files
        id: changed-files
        uses: tj-actions/changed-files@v40

      - name: Deploy Lambda functions
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          ENVIRONMENT_VARIABLES="Variables={FIREBASE_CREDENTIALS_BASE64=${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}}"

          # Region 결정 함수
          get_region() {
            if [[ "$1" == "index-sns" ]]; then
              echo "ap-northeast-1"
            else
              echo "ap-northeast-2"
            fi
          }

          # 전체 배포 여부 판단
          deploy_all=false
          if [[ -z "$CHANGED" ]]; then
            echo "No changed files. Deploying all."
            deploy_all=true
          elif [[ "$CHANGED" == *package.json* || "$CHANGED" == *package-lock.json* || "$CHANGED" == *.github/workflows/deploy.yml* ]]; then
            echo "Critical files changed. Deploying all."
            deploy_all=true
          fi
          
          # 모든 Lambda 함수의 코드 업데이트를 먼저 시작
          echo "🧩 Step 1: Lambda 코드 일괄 업데이트 시작"
          for file in *.mjs; do
            LAMBDA_NAME=$(basename "$file" .mjs)
            if [[ "$deploy_all" == true || "$CHANGED" == *$file* ]]; then
              REGION=$(get_region "$LAMBDA_NAME")
              ZIP_FILE="$LAMBDA_NAME.zip"

              echo "📦 Zipping and deploying code for $LAMBDA_NAME (region: $REGION)..."
              zip -r "$ZIP_FILE" "$file" node_modules/

              aws lambda update-function-code \
                --function-name "$LAMBDA_NAME" \
                --zip-file "fileb://$ZIP_FILE" \
                --region "$REGION"
            fi
          done

          echo "⏳ Step 2: Lambda 코드 업데이트 대기"
          for file in *.mjs; do
            LAMBDA_NAME=$(basename "$file" .mjs)
            if [[ "$deploy_all" == true || "$CHANGED" == *$file* ]]; then
              REGION=$(get_region "$LAMBDA_NAME")
              echo "⏳ Waiting for update to finish for $LAMBDA_NAME..."
              aws lambda wait function-updated \
                --function-name "$LAMBDA_NAME" \
                --region "$REGION"
            fi
          done

          # 모든 함수 설정 일괄 업데이트
          echo "⚙️ Step 3: Lambda 설정 일괄 업데이트 시작"
          for file in *.mjs; do
            LAMBDA_NAME=$(basename "$file" .mjs)
            if [[ "$deploy_all" == true || "$CHANGED" == *$file* ]]; then
              REGION=$(get_region "$LAMBDA_NAME")
              echo "🛠️ Updating config for $LAMBDA_NAME (region: $REGION)"
              aws lambda update-function-configuration \
                --function-name "$LAMBDA_NAME" \
                --handler "$LAMBDA_NAME.handler" \
                --environment "$ENVIRONMENT_VARIABLES" \
                --region "$REGION"
            fi
          done