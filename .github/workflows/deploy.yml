name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Install dependencies
        run: npm ci

      - name: Find changed files
        id: changed-files
        uses: tj-actions/changed-files@v40

      - name: Deploy Lambda functions
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          ENVIRONMENT_VARIABLES="Variables={FIREBASE_CREDENTIALS_BASE64=${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}}"

          if [[ -z "$CHANGED" ]]; then
            echo "No changed files detected. Deploying all Lambda functions (manual trigger or no changes)."
            for file in *.mjs; do
              LAMBDA_NAME=$(basename "$file" .mjs)
              ZIP_FILE="$LAMBDA_NAME.zip"
              
              if [[ "$LAMBDA_NAME" == "index-sns" ]]; then
                AWS_REGION="ap-northeast-1"
              else
                AWS_REGION="ap-northeast-2"
              fi

              echo "Zipping $file and deploying $LAMBDA_NAME to $AWS_REGION..."
              zip -r "$ZIP_FILE" "$file" node_modules/
              aws lambda update-function-code \
                --function-name "$LAMBDA_NAME" \
                --zip-file "fileb://$ZIP_FILE" \
                --region "$AWS_REGION"
              aws lambda update-function-configuration \
                --function-name "$LAMBDA_NAME" \
                --handler "$LAMBDA_NAME.handler" \
                --environment "$ENVIRONMENT_VARIABLES" \
                --region "$AWS_REGION"
            done
            exit 0
          fi

          IFS=$'\n'
          echo "Changed files: $CHANGED"

          if [[ "$CHANGED" == *package.json* || "$CHANGED" == *package-lock.json* || "$CHANGED" == *.github/workflows/deploy.yml* ]]; then
            echo "Detected critical changes. Deploying all Lambda functions."
            for file in *.mjs; do
              LAMBDA_NAME=$(basename "$file" .mjs)
              ZIP_FILE="$LAMBDA_NAME.zip"

              if [[ "$LAMBDA_NAME" == "index-sns" ]]; then
                AWS_REGION="ap-northeast-1"
              else
                AWS_REGION="ap-northeast-2"
              fi

              echo "Zipping $file and deploying $LAMBDA_NAME to $AWS_REGION..."
              zip -r "$ZIP_FILE" "$file" node_modules/
              aws lambda update-function-code \
                --function-name "$LAMBDA_NAME" \
                --zip-file "fileb://$ZIP_FILE" \
                --region "$AWS_REGION"
              aws lambda update-function-configuration \
                --function-name "$LAMBDA_NAME" \
                --handler "$LAMBDA_NAME.handler" \
                --environment "$ENVIRONMENT_VARIABLES" \
                --region "$AWS_REGION"
            done
          else
            echo "Deploying only changed Lambda functions."
            for file in $CHANGED; do
              if [[ "$file" == *.mjs ]]; then
                LAMBDA_NAME=$(basename "$file" .mjs)
                ZIP_FILE="$LAMBDA_NAME.zip"

                if [[ "$LAMBDA_NAME" == "index-sns" ]]; then
                  AWS_REGION="ap-northeast-1"
                else
                  AWS_REGION="ap-northeast-2"
                fi
                
                echo "Zipping $file and deploying $LAMBDA_NAME to $AWS_REGION..."
                zip -r "$ZIP_FILE" "$file" node_modules/
                aws lambda update-function-code \
                  --function-name "$LAMBDA_NAME" \
                  --zip-file "fileb://$ZIP_FILE" \
                  --region "$AWS_REGION"
                aws lambda update-function-configuration \
                  --function-name "$LAMBDA_NAME" \
                  --handler "$LAMBDA_NAME.handler" \
                  --environment "$ENVIRONMENT_VARIABLES" \
                  --region "$AWS_REGION"
              fi
            done
          fi